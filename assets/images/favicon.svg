<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeef8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd1dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#70537d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background soft circle -->
  <circle cx="32" cy="32" r="30" fill="#2a2238"/>
  <circle cx="32" cy="32" r="28" fill="#3b3252"/>
  <!-- Glowing Moon -->
  <path d="M38 12 A18 18 0 1 0 50 38 A16 16 0 1 1 38 12 Z" fill="#ffd166" opacity="0.4"/>
  <!-- Skull Face -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <ellipse cx="32" cy="33" rx="18" ry="16" fill="#fffaf5"/>
    <!-- Sleepy Eye Sockets -->
    <ellipse cx="25" cy="32" rx="4.5" ry="5.5" fill="#3b3252"/>
    <ellipse cx="39" cy="32" rx="4.5" ry="5.5" fill="#3b3252"/>
    <!-- Eye Sparkles -->
    <circle cx="26" cy="31" r="1.5" fill="#ffd166"/>
    <circle cx="40" cy="31" r="1.5" fill="#ffd166"/>
    <!-- Cute Button Nose -->
    <ellipse cx="32" cy="36" rx="1.2" ry="1.0" fill="#3b3252"/>
    <!-- Sweet Smile -->
    <path d="M28 40 Q32 44 36 40" stroke="#3b3252" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Pink Cheeks -->
    <ellipse cx="21" cy="37" rx="3" ry="1.8" fill="#ffb7b2" opacity="0.75"/>
    <ellipse cx="43" cy="37" rx="3" ry="1.8" fill="#ffb7b2" opacity="0.75"/>
  </g>
  <!-- Nightcap -->
  <path d="M16 28 C18 16, 42 14, 48 24 C50 14, 52 8, 56 12 C58 14, 56 22, 54 26 C46 22, 38 22, 16 28 Z" fill="#ffd1dc"/>
  <circle cx="56" cy="12" r="3.5" fill="#fffdf7"/>
  <!-- Bow -->
  <path d="M20 22 C22 19, 25 21, 23 24 C26 25, 24 28, 21 26 Z" fill="#ff85a2"/>
  <circle cx="21" cy="24" r="1.5" fill="#fff"/>
</svg>
